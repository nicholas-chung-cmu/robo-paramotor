# Settings for the computer this repo trains on. Edit them when you move to a
# different machine; nothing else in the repo needs to change. --num-envs,
# --rollout-steps and a --config file still override them, and a resumed run
# keeps its own.
#
# A git-ignored machine.local.toml next to this file overrides any of these on
# one computer only (e.g. a smaller workstation) without changing the repo.
#
# Active values: 2x NVIDIA RTX PRO 6000 Blackwell Max-Q (96 GB each, one
# machine). They are estimates scaled from a 16 GB RTX 5080's measurements,
# not yet measured on that machine. The 5080's own (tested) values are
# commented after each setting.

# GPUs docker/train.sh may use (--gpus 0,1 overrides). Each training container
# sees one GPU; --seeds K runs one worker per GPU in parallel, and each GPU
# has its own lock (runs/.gpu<N>.lock).
gpus = [0, 1]
# gpus = [0]                       # RTX 5080

# Parallel training environments, per GPU. Fewer environments with longer
# rollouts cost little speed while the GPU stays busy; if steps/s is poor at
# 512 on this card, try 1024 x 2048 (same batch and memory).
num_envs = 512
# num_envs = 128                   # RTX 5080 (throughput saturates near 512 there)

# Control steps (0.04 s each) every environment collects per PPO update.
# 4096 = 164 s, nearly a whole 1 km route (~180 s), so advantages see what
# actually followed rather than the critic's guess past a short cut-off.
# Batch per update = num_envs * rollout_steps (~25 KB/sample at JAX's peak);
# it must divide into the 32 PPO minibatches.
rollout_steps = 4096               # batch ~2.1 M, ~52 GB peak in JAX
# rollout_steps = 1024             # RTX 5080: 41 s, batch 131,072

# How far an action is judged on what actually followed. gamma: rewards count
# for about 0.04 s / (1 - gamma) ahead (0.999 = 40 s, 0.9995 = 80 s).
# gae_lambda: real rewards are weighted by (gamma * lambda) per step before
# the critic's estimate takes over. Higher = less bias, more noise.
gamma = 0.9995                     # ~80 s, to match the rollout
gae_lambda = 0.99
# gamma = 0.999                    # RTX 5080
# gae_lambda = 0.99                # RTX 5080

# Cap on the share of GPU memory JAX may take, 0-1, per program. It leaves
# room for MuJoCo Warp's physics buffers (allocated outside JAX; ~1 GB at 512
# envs) and for a desktop if one shares the card. On the 5080 desktop a GPU
# out-of-memory crashed the NVIDIA driver. Delete a line for no cap.
jax_memory_fraction = 0.7          # 67 GB of 96 GB
watcher_memory_fraction = 0.03     # the --headed watcher window
# jax_memory_fraction = 0.4        # RTX 5080: 6.6 GB of 16.6 GB
# watcher_memory_fraction = 0.1    # RTX 5080

# How MuJoCo Warp uses CUDA graphs (mujoco.mjx.warp.types.GraphMode): WARP
# (MJX's default on a GPU: capture and replay while buffer addresses match),
# WARP_STAGED / WARP_STAGED_EX (copy through fixed staging buffers so one graph
# is always replayed), JAX (JAX captures it as part of its own graph), NONE.
# Which is fastest is machine-specific: benchmark before long runs.
warp_graph_mode = "WARP"

# Two GPUs: a single training run uses one GPU (there is no data-parallel
# training across cards). Use both by running seeds in parallel:
#   docker/train.sh --name base --seeds 2     # seed0 on GPU 0, seed1 on GPU 1
