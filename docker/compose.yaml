# docker compose -f docker/compose.yaml run --rm rl <command>     e.g.
#   docker compose -f docker/compose.yaml run --rm rl python -m rl.train --smoke --output runs/smoke
# The repo is mounted at /workspace, so code edits apply without a rebuild and
# runs/ (checkpoints, metrics) lands on the host. Rebuild only when
# rl/requirements-rl.txt changes. See docs/RL.md -> Docker.
services:
  rl:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        JAX_CUDA: ${JAX_CUDA:-cuda13}
    image: paramotor-rl:${JAX_CUDA:-cuda13}
    volumes:
      - ..:/workspace
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
